// ============================================================================
//  版本 / 包名 规则（v28；2.0.0 起走 libxposed 现代 API）
//
//  单包：包名 io.github.ariinyume.dlsitesoundfloat。
//
//  LSPosed 模块列表里显示的三要素：
//    · 模块名  ← res/values/strings.xml 的 app_name（DLsiteFloat）
//    · 简介    ← AndroidManifest 的 android:description（@string/app_description）
//    · 图标    ← @mipmap/ic_launcher（res/mipmap-*/ic_launcher.png，圆角 80px）
//
//  ⚠️ namespace 与 applicationId 同为 io.github.ariinyume.dlsitesoundfloat：
//     java 包名与 META-INF/xposed/java_init.list 里的入口类全名都跟 namespace 走。
//
//  ── 2.0.0：传统 Xposed API → libxposed 现代 API（API 102）──
//    · 依赖：de.robv.android.xposed:api:82 → io.github.libxposed:api:102.0.0
//      （官方 AAR 在 **Maven Central**，settings.gradle 已有 mavenCentral()）。
//    · 入口：assets/xposed_init → src/main/resources/META-INF/xposed/java_init.list
//    · 作用域：assets/xposed_scope → META-INF/xposed/scope.list
//    · 模块配置：新增 META-INF/xposed/module.prop（minApiVersion / targetApiVersion）
//    · 简介/最低版本：AndroidManifest 的 4 个 xposed* meta-data 全部删除
//      （现代 API 不再读 meta-data；模块名走 android:label、简介走 android:description）
//    · ⚠️ META-INF/xposed/ 下三个文件**不要写注释行**（# 开头）：
//      libxposed 的 java_init.list 是「逐行 = 一个类名」的裸解析器，
//      混入注释会让入口解析失败 → 表现为「装上了但完全没调起、日志里一个字都没有」。
// ============================================================================

