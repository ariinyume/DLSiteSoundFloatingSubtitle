//        · 动因：Ari 2026-10-07 晚反馈。真机日志 `LSPosed_20261007_222354` 铁证：
//          22:23:18.215 Loaded 39 cues（轨 tc=7 dur=278.64s idx=0）
//          22:23:38.481 track changed 7→1 → 软挂起（变「无字幕」，**正确**）
//          22:23:53.483 soft verdict（cues=39 kept）
//          22:23:58.746 track changed 1→7 → **又是**软挂起（本轨字幕就在手上）
//          ⇒ 此后宿主复用自身响应缓存、**不再发 JSON** ⇒ 永久停在「无字幕」。
//        · 根因：恢复路径只有「新 JSON 到达」一条，而宿主对**同一轨**的响应有缓存，
//          切走再切回**不会重新发请求**。
//        · 修法①【数据层】给 cues 盖「主人印章」`cuesOwnerIdentity`（成功加载 JSON 时
//          记下当时的活跃播放列表身份）；换轨时若目标身份 == 印章 ⇒ 直接恢复渲染
//          （撤销挂起/软裁决/上一轨隔离，按当前进度重定位，必要时把自动关掉的窗口开回来）。
//        · 修法②【闸门】去抖闸门的「同对反向静默 20s」加例外：目标身份正是手上 cues 的
//          主人时立即放行（没有裁决窗要保护），并让静默窗失效，避免随后真换轨被反向同对吞掉。
//          ⚠️ 未改「同候选再次出现」「首报即报 + 长静默」的任何阈值。
//        · 权威门清单、软挂起/软裁决/`previousTrackCuesHidden` 的语义**一行未动**。
def appVersionCode = 980
def appVersionCodeLabel = '1007.8'
def appVersionName = '2.2.8'

android {
    namespace 'io.github.ariinyume.dlsitesoundfloat'
    compileSdk 34
    // ⚠️ 必须显式钉 34.0.0：AGP 8.1.0 的默认 build-tools 是 **33.0.1**，而本机 toolchain
    //    里的 33.0.1 缺 `core-lambda-stubs.jar` 等文件（工作区精简时被删）→ AGP 直接报
    //    「Installed Build Tools revision 33.0.1 is corrupted」。34.0.0 是完整的一套，
    //    也正是 docs/build.md 里写明的构建要求。
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "io.github.ariinyume.dlsitesoundfloat"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        debug {
            // 沿用默认 debug 签名
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // 需要 BuildConfig.APPLICATION_ID / VERSION_NAME 打进日志
        buildConfig true
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

// 让 APK 产物文件名带上「版本 + versionCode + 构建类型」。
// ⚠️【2026-10-04 Ari 指令】**文件名必须标出 versionCode** —— 历史上 2.1.3 出现过两个
//    不同的 code（955 / 958）、2.1.5 与「2.1.3 修复」也复用过同一个 958，光看
//    「DLsiteFloat-2.1.3-debug.apk」根本分不清装的是哪一版，返工时对不上号。
//    现在统一 DLsiteFloat-<versionName>-code<versionCode>-<buildType>.apk，
//    与工作区根目录的历史交付包命名（DLsiteFloat-2.1.4-code957-debug.apk）对齐。
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(
                    "DLsiteFloat-${appVersionTag}-code${appVersionCode}-${variant.buildType}.apk")
        }
    }
}

dependencies {
    // libxposed 现代 API（API 102）。compileOnly：API 由框架在运行时提供，不打进 APK。
    // ⚠️ 只能 compileOnly —— 打进包会导致模块与框架的 XposedInterface 类冲突。
    compileOnly 'io.github.libxposed:api:102.0.0'

    // ── 【M1】可视化设置页（PRD §7 / NFR-01）──────────────────────────────
    // 设置页是本模块**自己进程内**的独立 Activity（SettingsActivity），需要 MD3 组件。
    // ⚠️ 用 implementation（不是 compileOnly）：这些类要打进本模块 APK 供设置页使用。
    //    注入到宿主 / SystemUI 的视图（FloatingSubtitleView 等）一律用**代码构建**
    //    且不引用本模块资源 / 不依赖 Material（见 FloatingSubtitleView 类头），
    //    所以下游进程不会因为缺这些类而崩。
    // ⚠️ 首次构建需联网拉取（本机 toolchain/maven-local 里没有 androidx 制品）。
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.9.0'
}
