plugins {
    id 'com.android.application'
}

// ============================================================================
//  版本 / 包名 规则（v28；2.0.0 起走 libxposed 现代 API）
//
//  单包：包名 io.github.ariinyume.dlsitesoundfloat。
//
//  LSPosed 模块列表里显示的三要素：
//    · 模块名  ← res/values/strings.xml 的 app_name（DLsiteFloat）
//    · 简介    ← AndroidManifest 的 android:description（@string/app_description）
//    · 图标    ← @mipmap/ic_launcher（res/mipmap-*/ic_launcher.png，圆角 80px）
//
//  ⚠️ namespace 与 applicationId 同为 io.github.ariinyume.dlsitesoundfloat：
//     java 包名与 META-INF/xposed/java_init.list 里的入口类全名都跟 namespace 走。
//
//  ── 2.0.0：传统 Xposed API → libxposed 现代 API（API 102）──
//    · 依赖：de.robv.android.xposed:api:82 → io.github.libxposed:api:102.0.0
//      （官方 AAR 在 **Maven Central**，settings.gradle 已有 mavenCentral()）。
//    · 入口：assets/xposed_init → src/main/resources/META-INF/xposed/java_init.list
//    · 作用域：assets/xposed_scope → META-INF/xposed/scope.list
//    · 模块配置：新增 META-INF/xposed/module.prop（minApiVersion / targetApiVersion）
//    · 简介/最低版本：AndroidManifest 的 4 个 xposed* meta-data 全部删除
//      （现代 API 不再读 meta-data；模块名走 android:label、简介走 android:description）
//    · ⚠️ META-INF/xposed/ 下三个文件**不要写注释行**（# 开头）：
//      libxposed 的 java_init.list 是「逐行 = 一个类名」的裸解析器，
//      混入注释会让入口解析失败 → 表现为「装上了但完全没调起、日志里一个字都没有」。
// ============================================================================

// ── 版本号规则（v29；2.0.0 起）────────────────────────────────────────────
//   versionName : 语义化版本（2.0.0 / 2.0.1 …）
//   versionCode : **发版前（以 push 到 git 为准）最后修改日期的 MMDD**，
//                 如 9 月 20 日发版 → 0920；10 月 3 日 → 1003。
//                 ⚠️ 不是 20000 这种「语义版本 ×1000」的老规则。
//                 同日多次发版时后一位可用 0921/0922 递增（保持单调即可）。
def appVersionTag = '2.2.14'
// ⚠️ 写成 int 字面量 925（不要写 0925 —— Groovy 可能按八进制/前导零解析）：
//    versionCode 的**数值**是 925，管理器里显示 925，可读语义看 appVersionCodeLabel。
// ── 版本履历（code 994 / label 1008.15）──
//
// ⚠️ **本文件不再是历史档案。** 完整 38 条履历（code 923 → 992）已搬至
//    仓库根 `CHANGELOG.md`，用 `python tools/extract_changelog.py` 可从本文件重新生成。
//    这里只留最近 3 条摘要，改动请先改 CHANGELOG.md。
//
//    【2.2.14e / code 990 / label 1008.11】**「较暗背景整体发白」返工：目标亮度 0.50 → 0.42**
//        （Ari 2026-10-09；按 Ari 指令：**不动 versionName，只升 code**）。
//        · 【现象】较暗背景下，液态玻璃状态的悬浮窗整体发白。
//        · 【根因】989 把"面板目标亮度"钉成 0.50 —— 那是**错的取值依据**：0.50 是旧斜率
//        曲线在**亮背景侧**的落点，把它当成恒定目标，等于把所有背景（含暗背景）
//        都硬拉到同一个亮度上。真机复测（录屏 `Record_2026-10-09-12-15-46` +
//        日志 `LSPosed_20261009_121641`）实测：宿主采样均值 0.39 的紫色页上，
//        旧版落点 0.421、989 落点 **0.508**（整整白了 22 级灰度），
//        白字对比度也跟着掉了 —— 这正是"整体发白"。
//        · 【修法】目标改取"用户一直没抱怨过的那一档" = 旧斜率曲线在暗背景侧的 **0.42**：
//        同一页面上霜面由 22% 白降到 **8%** 白、面板回到 0.42；
//        亮背景侧（纯白页）由旧版的 0.58 收到 0.42，**白字对比度同时变好**
//        （与 2.2.14「空白页面几乎有点看不太清字幕」的诉求同向）。
//        "反解霜量、把面板亮度钉住"这条机制**一字未动** ⇒ 切页依然不跳，
//        只是整块的落点更暗、更接近"烟熏中性玻璃"的原始口径。
//
//    【2.2.14f / code 991 / label 1008.12】**切页"亮度跳"根因返工(二)：霜面改「密度固定、由霜色补偿」
//        + 留底基线落盘**（Ari 2026-10-09；按 Ari 指令：**不动 versionName，只升 code**）。
//        · ①【亮度跳变还蛮明显】990 之后亮度虽然被钉住了，但**糊度**在页面之间大幅摆动 ——
//        按真机页面实算：深色页（背景 0.25）要蒙 24% 白霜、亮封面页（0.73）要蒙 45% 黑霜。
//        面板亮度一样、观感却在"发白 ↔ 发暗"之间跳。物理上这是必然的：
//        **单层半透明面板不可能同时做到"亮度恒定"和"糊度恒定"** —— 989/990 选了前者
//        （霜色写死、霜量随背景摆），本次改选后者。
//        · 【修法】密度写死（`ADAPTIVE_VEIL_ALPHA = 0.45` × 模糊强度），改由**霜色的亮度**
//        把面板补到目标亮度（解 X·(1-α)+cv·α = TARGET）；霜色本身取背景上下缘平均色，
//        所以唯一随页面变的是**色相** —— 而色相正是玻璃该随页面变的东西
//        （背景仍以 45% 的比例透出）。取 0.45 的依据：要让最亮页面(0.73)也压得到目标，
//        需 α ≥ 1 − 0.42/0.73 ≈ 0.43，留一点余量取 0.45。
//        · ②【留底基线落盘】新增 `util/BackdropBaseline`：宿主不可见时（用户在设置页保存/
//        回到桌面）采样拿不到东西 —— 这不是"采样停了"，是**采集源只能是宿主自己的窗口**
//        （零权限的前提），桌面与别的应用在物理上取不到。于是把内存留底顺手写盘（节流：
//        变化 ≥0.02 且距上次 ≥10s 才写），让"进程被回收重启后第一次开液态玻璃"也有值可打底。
//
//    【2.2.14h / code 993 / label 1008.14】**架构重构：履历归档 + 几何内核可测试化**
//        （Ari 2026-10-09 指令「做 P0：CHANGELOG + 抽几何 + 分批commit」；按Ari 口径不动 versionName，只升 code）
//        · ①【履历归档】`app/build.gradle` 690 行里617 行是注释（89%），38 条版本履历寄生在
//          构建脚本里、且是code 981~992 十二轮的唯一可检索副本（`docs/修复说明/` 只到 980）。
//          现整块搬至仓库根 `CHANGELOG.md`（666 行 / 38 条），build.gradle 只留最近 3 条摘要 +
//          指向指针（690 → 170 行，-520 行）。
//          搬迁由脚本 `tools/extract_changelog.py` 完成，**条目正文一字未改**，只重排版与清缩进；
//          脚本内含断言（条数 38 / 首 0921.1 / 尾 2.2.14g / 必须含 code 978 那条），
//          解析数不对即抛异常停手。已做反向核对：38 条首句逐条在 CHANGELOG 中原样命中。
//          ⚠️ 搬迁时发现原块里 code 978 那条前缀误写成 '// 【'（少一格空格），
//            它是一条真实且关键的履历（判据换根），脚本已按「行首是【」定位以免丢失。
//        · ②【几何可测试化】`ActivityButtonHook` 的胶囊落位算术（4,780 行上帝类里的 292 行）
//          抽成 `hook/CapsuleGeometry`：纯计算内核，一行状态都不持有，**首次变得可单测**。
//          ⚠️ 抽取时的取证结论（推翻「看着像纯函数」的直觉）：原`capsuleBottomForSlider`
//          有 **7 处静态字段写入**（去抖状态 sDescBottomStable / 胶囊高 sCapsuleHPx ×2 /
//          调用计数 / 打点快照 ×2），且 `dip2px → capsuleDip → capsuleMetricsDensity`
//          会懒锁定并写 sCapsuleMetricsDensity 与 sDensityPx。
//          ⇒ 这些副作用**刻意留在 hook 侧**，通过入参/出参传递；算术口径一字未改。
//          顺带统一了 `clampRight`/`clampBottom`（原先 showButton 与 replaceCapsuleByGeometry
//          各写一份口径，值未变）。
//        · ③【日志闸门补交】`util/LogGate` 等 6 个文件此前一直是未跟踪状态（`??`），
//          其中 `view/LiquidGlassDrawable` 是液态玻璃系列 981~992 十二轮的核心绘制类，
//          丢一个文件即返工无据。本轮一并入库。
//        · ④ 日志分级施工图已落地：`docs/日志类目梳理与调试分级-2.2.14-code992.md` §9 的
//          C 类清单全部接入 `LogGate`（实测 12 个文件逐条对上，ConfigBus 走自己的
//          `logDebug()` 包装，内部仍是 LogGate.enabled()）；BUILD 横幅常开只剩一行版本号，
//          历史履历全部归入调试开关。
//        验证：`rm -rf app/build` 后 `compileDebugJavaWithJavac --offline` BUILD SUCCESSFUL；
//        几何等价性对照 `tools/geom/verify_capsule_geometry.py`（真机实测黄金向量：
//        sliderCy=1807→bottom=1066、sliderCy=1799→bottom=1074，与原实现注释记录的
//        2.1.3/code 954 实测值逐字一致）。
//        已知限制：本轮**未出包**（出包前须再 clean 一次，增量产物与 clean 差字节会让双闭环假 FAIL）。
//    【2.2.14g / code 992 / label 1008.13】**「玻璃颜色变奇怪」返工：密度 0.45 → 0.22、霜色回中性灰**
//        （Ari 2026-10-09；按 Ari 指令：**不动 versionName，只升 code**）。
//        · 【现象】「现在玻璃的颜色反而变奇怪了，不如之前的版本」（录屏
//        `Record_2026-10-09-12-49-42` + 日志 `LSPosed_20261009_125019`）。
//        · 【根因】991 为了让**最亮的页面**也能被压到目标亮度，把霜面密度抬到了 0.45
//        （依据 (1-α)·X ≤ TARGET，本机最亮背景≈0.73 ⇒ α ≥ 0.43）。但密度一大，
//        霜面就**只能用灰去补亮度** —— 面板变成一层 45% 的灰/灰紫水洗色，把页面
//        本身的颜色洗掉了（实测：亮页几乎发白灰、紫页发灰紫）。
//        991 另外还给霜色加了"取背景上下缘平均色"的做法，本意是让玻璃像这一页被
//        压暗后的样子，但一个"被压暗的浅色"看起来就是发闷的灰（越暗越灰），
//        等于在洗色之上再叠一层偏色。
//        · 【修法】其一，密度 **0.45 → 0.22**：背景的颜色以约 **78%** 的比例透出来
//        （之前的版本之所以"颜色对"，正是因为透出比例高），代价是很亮的页面压不到
//        目标亮度、会停在 (1-α)·X 上（0.73 的亮封面页落在 0.57），与 990 之前的老
//        版本同一量级、也正是用户一直没抱怨过的那一档。其二，霜色**回到中性灰**，
//        砍掉"取背景色相"那套 —— 面板的颜色只由透出来的背景决定，霜只负责补亮度。
//        · 保留不动：霜量固定（不再随背景摆动，切页不会"一会发白一会发暗"）、
//        989 的留底基线与 991 的留底落盘、988 的噪声鲁棒过渡缓冲。
//
def appVersionCode = 994
def appVersionCodeLabel = '1008.15'
def appVersionName = '2.2.14'

android {
    namespace 'io.github.ariinyume.dlsitesoundfloat'
    compileSdk 34
    // ⚠️ 必须显式钉 34.0.0：AGP 8.1.0 的默认 build-tools 是 **33.0.1**，而本机 toolchain
    //    里的 33.0.1 缺 `core-lambda-stubs.jar` 等文件（工作区精简时被删）→ AGP 直接报
    //    「Installed Build Tools revision 33.0.1 is corrupted」。34.0.0 是完整的一套，
    //    也正是 docs/build.md 里写明的构建要求。
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "io.github.ariinyume.dlsitesoundfloat"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        debug {
            // 沿用默认 debug 签名
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // 需要 BuildConfig.APPLICATION_ID / VERSION_NAME 打进日志
        buildConfig true
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

// 让 APK 产物文件名带上「版本 + versionCode + 构建类型」。
// ⚠️【2026-10-04 Ari 指令】**文件名必须标出 versionCode** —— 历史上 2.1.3 出现过两个
//    不同的 code（955 / 958）、2.1.5 与「2.1.3 修复」也复用过同一个 958，光看
//    「DLsiteFloat-2.1.3-debug.apk」根本分不清装的是哪一版，返工时对不上号。
//    现在统一 DLsiteFloat-<versionName>-code<versionCode>-<buildType>.apk，
//    与工作区根目录的历史交付包命名（DLsiteFloat-2.1.4-code957-debug.apk）对齐。
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(
                    "DLsiteFloat-${appVersionTag}-code${appVersionCode}-${variant.buildType}.apk")
        }
    }
}

dependencies {
    // libxposed 现代 API（API 102）。compileOnly：API 由框架在运行时提供，不打进 APK。
    // ⚠️ 只能 compileOnly —— 打进包会导致模块与框架的 XposedInterface 类冲突。
    compileOnly 'io.github.libxposed:api:102.0.0'

    // ── 【M1】可视化设置页（PRD §7 / NFR-01）──────────────────────────────
    // 设置页是本模块**自己进程内**的独立 Activity（SettingsActivity），需要 MD3 组件。
    // ⚠️ 用 implementation（不是 compileOnly）：这些类要打进本模块 APK 供设置页使用。
    //    注入到宿主 / SystemUI 的视图（FloatingSubtitleView 等）一律用**代码构建**
    //    且不引用本模块资源 / 不依赖 Material（见 FloatingSubtitleView 类头），
    //    所以下游进程不会因为缺这些类而崩。
    // ⚠️ 首次构建需联网拉取（本机 toolchain/maven-local 里没有 androidx 制品）。
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.9.0'
}
