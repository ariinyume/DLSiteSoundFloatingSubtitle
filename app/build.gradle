//        I. **4.1 / 4.2 滚动**：页头行 / 状态卡 / 引导小字 scrollFlags 由
//           `scroll|enterAlways` 改 **`scroll`** —— 只在滚回页面最顶部才出现，
//           不再和吸顶的预览窗一起回来（4.2），也不再与 NestedScrollView 抢滚动量（4.1）。
//        J. **6.1.1 悬浮窗彩色面板控件转白**（Ari 第二次点名）：真 bug 是 init() 里
//           applyPanelBackground() 早于 closeBtn/gripView 创建 ⇒ applyControlTint() 空转，
//           而 refreshStyle() 的补色分支在「视图重建、style 是新建」时走不到。
//    【1006.1】code **963**：versionName 2.3.2 → **2.3.3**。963 严格高于所有已发/已占号
//        （954/956/957/958/959/960/961/962）。**代码零改动，只修一个资源层的语法错**：
//        🔴 code 962 装上后**设置页一点就闪退**（Ari 2026-10-06 00:09 报告，LSPosed 日志
//           `dropbox/data_app_crash@…` ×10 全同一异常）：
//             RuntimeException: Unable to start activity …SettingsActivity:
//               Resources$NotFoundException: Drawable …:drawable/ic_import with resource ID #0x7f07008c
//             Caused by: IllegalArgumentException: L needs to be followed by a multiple of 2 floats.
//               However, 1 float(s) are found. Failure occurred at position 19 of path:
//               M19,9h-4L15,3L9,3v6L5l7,7 7,-7zM5,18v2h14v-2L5,20z
//        根因：962 新增的 `res/drawable/ic_import.xml` 里 pathData 写着 `L5` —— **`L` 必须跟
//           偶数个坐标，这里只给了 1 个**（原作者把 MD 官方的 `H5` 手工改写成 `L5` 时漏了 y）。
//           aapt2 **不校验 pathData 语法**（它在 arsc 里就是普通字符串）⇒ 编译过、`aapt2 dump
//           xmltree` 也打得出来，**只有真机 VectorDrawable 解析时才抛** ⇒ 崩在
//           `onCreate → buildRows → buildMiscGroup → makeTonalButton → setIconResource`，
//           Activity 直接起不来。同一路径里 `L5,20`（该是 `H5`）语法合法但几何错，
//           会把托盘右下角画成对角线。
//        修法：`ic_import` / `ic_export` 双双改回 **MD 官方原文**（H/V 保留，不再做等价改写）：
//           ic_import: M19,9h-4V3H9v6H5l7,7 7,-7zM5,18v2h14v-2H5z
//           ic_export: M9,16h6v-6h4l-7,-7 -7,7h4v6zM5,18h14v2H5z
//        ★ 新增验证层 `_rel232/verify_pathdata.py`（+ `selftest_pathdata.py`）：
//           对 res/ 下**所有** `<vector>` 的 pathData 做「命令元数自洽 + 子路径包围盒不越界」
//           两层离线校验 —— 补上 dex 三层 / aapt2 资源层都覆盖不到的这块盲区。
//           ⚠️ 边界：能抓「元数错（会崩）」与「坐标越界」，**抓不到「形状错但坐标都合法」**。
def appVersionCode = 972
def appVersionCodeLabel = '1006.10'
def appVersionName = '2.2.0'

android {
    namespace 'io.github.ariinyume.dlsitesoundfloat'
    compileSdk 34
    // ⚠️ 必须显式钉 34.0.0：AGP 8.1.0 的默认 build-tools 是 **33.0.1**，而本机 toolchain
    //    里的 33.0.1 缺 `core-lambda-stubs.jar` 等文件（工作区精简时被删）→ AGP 直接报
    //    「Installed Build Tools revision 33.0.1 is corrupted」。34.0.0 是完整的一套，
    //    也正是 docs/build.md 里写明的构建要求。
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "io.github.ariinyume.dlsitesoundfloat"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        debug {
            // 沿用默认 debug 签名
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // 需要 BuildConfig.APPLICATION_ID / VERSION_NAME 打进日志
        buildConfig true
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

// 让 APK 产物文件名带上「版本 + versionCode + 构建类型」。
// ⚠️【2026-10-04 Ari 指令】**文件名必须标出 versionCode** —— 历史上 2.1.3 出现过两个
//    不同的 code（955 / 958）、2.1.5 与「2.1.3 修复」也复用过同一个 958，光看
//    「DLsiteFloat-2.1.3-debug.apk」根本分不清装的是哪一版，返工时对不上号。
//    现在统一 DLsiteFloat-<versionName>-code<versionCode>-<buildType>.apk，
//    与工作区根目录的历史交付包命名（DLsiteFloat-2.1.4-code957-debug.apk）对齐。
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(
                    "DLsiteFloat-${appVersionTag}-code${appVersionCode}-${variant.buildType}.apk")
        }
    }
}

dependencies {
    // libxposed 现代 API（API 102）。compileOnly：API 由框架在运行时提供，不打进 APK。
    // ⚠️ 只能 compileOnly —— 打进包会导致模块与框架的 XposedInterface 类冲突。
    compileOnly 'io.github.libxposed:api:102.0.0'

    // ── 【M1】可视化设置页（PRD §7 / NFR-01）──────────────────────────────
    // 设置页是本模块**自己进程内**的独立 Activity（SettingsActivity），需要 MD3 组件。
    // ⚠️ 用 implementation（不是 compileOnly）：这些类要打进本模块 APK 供设置页使用。
    //    注入到宿主 / SystemUI 的视图（FloatingSubtitleView 等）一律用**代码构建**
    //    且不引用本模块资源 / 不依赖 Material（见 FloatingSubtitleView 类头），
    //    所以下游进程不会因为缺这些类而崩。
    // ⚠️ 首次构建需联网拉取（本机 toolchain/maven-local 里没有 androidx 制品）。
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.9.0'
}
