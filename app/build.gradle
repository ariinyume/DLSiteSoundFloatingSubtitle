plugins {
    id 'com.android.application'
}

// ============================================================================
//  版本 / 包名 规则（v28）
//
//  单包：包名 com.sena.dlsitesoundfloat。
//
//  LSPosed 模块列表里显示的三要素：
//    · 模块名  ← res/values/strings.xml 的 app_name（DLsiteFloat）
//    · 简介    ← AndroidManifest 的 <meta-data name="xposeddescription">
//    · 图标    ← @mipmap/ic_launcher（res/mipmap-*/ic_launcher.png，圆角 80px）
//
//  ⚠️ namespace 与 applicationId 同为 com.sena.dlsitesoundfloat：
//     java 包名与 assets/xposed_init 里的入口类全名都跟 namespace 走。
// ============================================================================

def appVersionTag = '1.21.0'
def appVersionCode = 12100
def appVersionName = '1.21.0'

android {
    namespace 'com.sena.dlsitesoundfloat'
    compileSdk 34

    defaultConfig {
        applicationId "com.sena.dlsitesoundfloat"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        debug {
            // 沿用默认 debug 签名
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // 需要 BuildConfig.APPLICATION_ID / VERSION_NAME 打进日志
        buildConfig true
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

// 让 APK 产物文件名带上「版本 + 构建类型」，便于区分各次打包。
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("DLsiteFloat-${appVersionTag}-${variant.buildType}.apk")
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
