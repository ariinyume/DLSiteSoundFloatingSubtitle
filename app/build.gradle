plugins {
    id 'com.android.application'
}

// ============================================================================
//  版本 / 包名 规则（v28；2.0.0 起走 libxposed 现代 API）
//
//  单包：包名 io.github.ariinyume.dlsitesoundfloat。
//
//  LSPosed 模块列表里显示的三要素：
//    · 模块名  ← res/values/strings.xml 的 app_name（DLsiteFloat）
//    · 简介    ← AndroidManifest 的 android:description（@string/app_description）
//    · 图标    ← @mipmap/ic_launcher（res/mipmap-*/ic_launcher.png，圆角 80px）
//
//  ⚠️ namespace 与 applicationId 同为 io.github.ariinyume.dlsitesoundfloat：
//     java 包名与 META-INF/xposed/java_init.list 里的入口类全名都跟 namespace 走。
//
//  ── 2.0.0：传统 Xposed API → libxposed 现代 API（API 102）──
//    · 依赖：de.robv.android.xposed:api:82 → io.github.libxposed:api:102.0.0
//      （官方 AAR 在 **Maven Central**，settings.gradle 已有 mavenCentral()）。
//    · 入口：assets/xposed_init → src/main/resources/META-INF/xposed/java_init.list
//    · 作用域：assets/xposed_scope → META-INF/xposed/scope.list
//    · 模块配置：新增 META-INF/xposed/module.prop（minApiVersion / targetApiVersion）
//    · 简介/最低版本：AndroidManifest 的 4 个 xposed* meta-data 全部删除
//      （现代 API 不再读 meta-data；模块名走 android:label、简介走 android:description）
//    · ⚠️ META-INF/xposed/ 下三个文件**不要写注释行**（# 开头）：
//      libxposed 的 java_init.list 是「逐行 = 一个类名」的裸解析器，
//      混入注释会让入口解析失败 → 表现为「装上了但完全没调起、日志里一个字都没有」。
// ============================================================================

// ── 版本号规则（v29；2.0.0 起）────────────────────────────────────────────
//   versionName : 语义化版本（2.0.0 / 2.0.1 …）
//   versionCode : **发版前（以 push 到 git 为准）最后修改日期的 MMDD**，
//                 如 9 月 20 日发版 → 0920；10 月 3 日 → 1003。
//                 ⚠️ 不是 20000 这种「语义版本 ×1000」的老规则。
//                 同日多次发版时后一位可用 0921/0922 递增（保持单调即可）。
def appVersionTag = '2.1.2'
// ⚠️ 写成 int 字面量 925（不要写 0925 —— Groovy 可能按八进制/前导零解析）：
//    versionCode 的**数值**是 925，管理器里显示 925，可读语义看 appVersionCodeLabel。
//    【0921.1】2.0.1 的**9/21 第一版**（code 923 → 924，versionName 不变）：
//    几何 75x32dp / 圆角 16dp / 垂直中点复核（+诊断日志）；
//    bug1 滑条坐标稳定性判据（按钮上下摆动）；bug2 字幕半截宽度；
//    新功能：双击状态栏字幕位置关闭状态栏字幕。
//    【0921.2】code 924 → **925**：**P0 回归修复** —— 924 的 bug1 稳定性判据
//    被错做进了「探测」里（不稳定直接 return），导致 hasMainSlider 永不置位、
//    verdict 塌成 UNKNOWN、**按钮完全不出现**（实测 PLAYER 判定 90 次 → 1 次）。
//    修法：探测只如实上报，新增 ScanResult.mainSliderStable 把「能否采信」
//    交给消费端（ActivityButtonHook）—— 不稳定时沿用上次稳定值，绝不隐藏按钮。
//    【0921.7】code 930：**三条 bug 日志实证修复**（work_diag_55）。
//    bug1 先半截再整行：showLine 的 applyFluidBoundary(true) 在 sLayoutDirty 时被
//    降级成 150ms 延迟合并 → 新行长文本先以旧行宽度可见再落地 = 半截；改 force 路径
//    无条件立即落地（脏则落地后再核一次防漂移）。
//    bug2 单击就关闭：删除 sLineView 旧双击监听（与 root dispatchTouchEvent 观察者
//    共享 sLastTapMs，一次 DOWN 被算两遍）；仅保留 root hook。
//    bug3 按钮掉到播放控件下：handleSlider 稳定性判据（929 改丢）恢复「基准跟上一帧
//    原始坐标 + 容差放宽到 12px」，消除 925 式死锁 → sLastSliderCy 重新收敛 → 中点落位。
//    【0923.1】code 943：给全部 19 个 .java 补 GPL-3.0 文件头（Copyright (C) 2026
//    ariinyume + SPDX-License-Identifier: GPL-3.0-or-later）；942 的「切轨提前收窗」
//    阈值由 2s 放宽到 6s。
//    【0923.2】code 944：切轨提前收窗阈值由 6s 收到 4s；✕ 关闭按钮改为
//    「点面板出现 + 5s 无操作自动隐藏」；状态栏字幕开关按钮的
//    「未授权 SystemUI 作用域则不显示」闸门（code 941）真正打进交付包，
//    并加 0.4s / 1.2s 两拍快速补探。
//    【0923.3】code 945：✕ 关闭按钮在「点面板出现 + 5s 无操作自动隐藏」之外，
//    再点一次面板空白处（✕ 以外）立即收回，两种收法并存；状态栏通知数徽标的数字
//    改为**镂空数字**（saveLayer + BlendMode.CLEAR 从圆底里挖掉），数字区域直接
//    透出状态栏自己的底色，不再用 #1A1A1A / #F2F2F2 近似色填充。
//    【0923.5】code 947：修「状态栏字幕打开时徽标里看不到通知数量」。946 的 EVEN_ODD
//    洞在真机上根本没出现（实测圆盘 33×33 完全实心、内切 23×23 零个暗像素）；
//    根因是每帧的 Path.rewind() 会把 FillType 清回 WINDING（reset() 才会保留，
//    Android 源码里 reset() 专门存取 FillType，rewind() 没有这层保护），于是圆与字形
//    同向取并集 = 实心圆。改用 reset() 并每帧显式 setFillType 兜底，自证日志追加
//    fill= 与 glyph= 两项，一眼可验。
//    【0923.4】code 946：修「状态栏通知数徽标整块不显示」（945 的回归）。徽标绘制
//    弃用 saveLayer + BlendMode.CLEAR（实测在这台机器的 SystemUI 里整块画不出来，
//    而让位空隙却是真的 = 圆底与数字一起消失），改为**一条 Path + EVEN_ODD** 挖洞：
//    圆与字形同属一条 path，重叠处不填色即为洞。另加 onMeasure 尺寸兜底与
//    「徽标几何自证」日志（徽标到底有没有尺寸/可见，一行看穿）。
//    【2.0.2】code 947（versionName 2.0.1 → 2.0.2；versionCode 与 label 不变）：
//    947 的「一条 Path + EVEN_ODD 挖洞」修好了 946 的「圆盘出现但看不到数字」
//    （根因：每帧 Path.rewind() 把 FillType 清回 WINDING，reset() 才会保留），
//    本版同时把这几项一并纳入正式发版：未授权 SystemUI 作用域则不显示状态栏字幕
//    开关按钮（跨进程握手探测）、切到无字幕音轨 4s 内提前收窗、点面板出现的
//    ✕ 关闭按钮「5s 无操作自动隐藏 + 再点面板空白处立即收回」。
//    【0924.1】code 948：修「点简介回作品页时按钮比播放页/进度条晚约 0.75s 才消失」。
//    视频逐帧像素取证：播放页特征区 t≈1.05s 归零、胶囊按钮区 t≈1.80s 才归零；日志对应
//    `anchor dead for 0ms (area=0% evidence=false need=600ms)` → 600ms 后才 hide。
//    修法：锚点**面积归零**时确认窗由 600ms 收到 120ms（三档：证据 200ms / 归零 120ms /
//    默认 600ms）。不改默认档 —— 假死的表现是容器部分可见（30~45%），归零只有「整页被
//    卸载」或「拖到完全看不见且已停住」两种。诊断日志新增 gone= 直接可验。
//    【0924.2】code 949：修 948 残留的 100~200ms 滞后。30fps 视频逐帧像素复测：
//    「页面消失 → 胶囊消失」= +133/+100/+200/+200/+67ms，与日志的 120ms 档完全吻合 ——
//    首次采样虽与页面消失同帧，但 need=120ms 迫使它再等一个 120ms 探针周期，永远吃满。
//    修法：归零档 need 取 0、采样门槛由 2 降到 1（首次检测即收起）；为防 fling 中锚点
//    被滚出屏幕时误收，新增前置门「页面已静止 ≥80ms」（真离场实测 still=209~729ms，
//    全部远超此门）。诊断日志新增 goneStill= 直接可验。
//    【0926.1】code 951：修「偶尔按键会到页面上不合理的位置（挡住音声的封面）」
//    （Ari 2026-09-25 反馈 + 随附 LSPosed 日志）。根因不在几何，而在**跟手偏置被转场
//    位移污染**：日志 09:33:41.155 打出 `page follow bias calibrated: 431px`，
//    而同一刻 `[几何4] sliderCy=2233`（稳态 1799，差 434px）—— 打开播放页那一次标定
//    踩进了入场转场中途的 80ms 停顿窗，把「还没走完的 431px」当成宿主静态偏置记了下来。
//    此后 `vis = ΣtranslationY − 431` 在页面真正静止时恒为 −431，被写进按钮 translationY
//    ⇒ 两个胶囊整体抬高 431px，从「滑条上方」跑到标题/封面下缘（转场相位更早时更高，
//    正好压在封面上）。偏置只标定一次、`captureFollowBaseline()` 又被
//    `sFollowAppliedY != 0` 挡在门外 ⇒ 标错就**整个进程都错**，这就是「偶尔」的成因。
//    修法（ActivityButtonHook，详见 【code 951】注释）：门①.5「页面最近没动过」接到
//    位移采样时间轴上；门②.5 候选位置连续稳住 400ms（墙钟）；门⑤ 偏置量级闸 64dp；
//    新增 `healStaleBiasIfAtRest()` 自愈（页面确在布局静止位却带非零位移 → 重标偏置）。
//    诊断新增 `baseline deferred:` / `bias NOT adopted:` / `stale bias healed:` 三行。
//    ⚠️ code 由 950 递增到 951（**不是**按日期算的 926 —— 那会小于已装的 950，
//     Android 会判 version downgrade 装不上）。
//    【0926.2】code 954：本包并入三轮改动 ——
//    ①【code 952】按钮不再用「上次结论」预判可见性（Ari 报「按钮偶尔还是会在非播放页
//      出现」）：新建按钮一律先 GONE，可见性交给紧随其后的检测；配套 sForceNextDetect
//      让 addView 触发的首帧扫描不被 150ms 节流吃掉，所以播放页上仍然同一帧亮起。
//      日志新增 `wouldTrust=`（只作诊断）。取证：work_diag_80 两次 trusted 重建
//      （lastPlayerSeenAgo=1310/1377ms）都比首次检测早 230~240ms 亮在非播放页上。
//    ②【code 953】「整棵树扫成空」的一趟扫描不再当作判隐藏的证据（治「播放页上按钮每
//      ~700ms 闪一次」，8 秒 6 次）：命中「全空 + 上一趟还是播放页证据 + 按钮正显示」时
//      本轮不收起，改为 60ms 后强制补检；真离场在补检里照样收起（只晚 60ms），退化测量
//      则被发现、不再误收。日志新增 `[code 953] empty scan while capsule showing`。
//    ③【code 954】多语言（Ari 2026-09-26 需求）：新增 util/I18n 统一对外文案 ——
//      简体（简体中文/中文（简体））保持原样；繁体（繁體中文 / 中文（繁體）/
//      繁體中文（中國香港/中國台灣/香港/台灣）→ 狀態欄 開/關、懸浮窗 開/關、無字幕；
//      其它语言 → Status ON/OFF、Popup ON/OFF、No Sub，悬浮窗占位 No Subtitles。
//      同时把「切到无字幕音轨后悬浮窗挂着无字幕占位的时长」由 4s 改为 **5s**
//      （NO_SUBTITLE_EARLY_CLOSE_MS，数据侧裁决窗未动）。
//    ④【同版本号第二次打包】单个胶囊宽 **75dp → 85dp**（Ari 2026-09-26 指令，
//      versionName / versionCode 均不变 —— 按本文件的老规矩，同版本号可能对应多个包，
//      装机前用日志里的 `==== BUILD 2.1.2 / code 954` 那一行 + 本描述里的「85dp」确认）。
//      组宽随之 160dp → 180dp（容器 wrap_content，子视图宽度是唯一真源）。
//    ⑤【同版本号第三次打包】code 955：**锁死胶囊大小与按钮内文字大小** ——
//      真机日志（work_diag_82，15:34~15:36）里宿主 App 的 density 在 2.9750001 / 3.5 /
//      3.875（= OPPO 屏幕缩放三档）之间长期来回跳，而 code 939 的「持续 20s 就重锁」
//      把每个档位都当新常态锁一遍 ⇒ `[几何4] capsuleH` 在 95/112/124px 间反复变
//      （宽/圆角/文字/偏移同吃一套 dip2px），用户看到「按钮大小随显示大小变化」。
//      修法：新增「胶囊度量锁定密度」（首次取宿主稳定密度锁死一次，dip2px 全部改走它，
//      此后任何重锁都不跟随）；胶囊文字改**固定 px**（13sp 设计值 × 锁定密度，不吃
//      scaledDensity），并用粗体按「胶囊宽 − 左右各 4dp」量过当前语言全部文案自动缩到
//      放得下（下限 10sp 等效），配 singleLine + 不省略号 + 去字体留白 ⇒ 完全显示有保证。
//      诊断新增 `[code 955] capsule metrics density locked:` / `capsule text locked:` 两行。
def appVersionCode = 954
def appVersionCodeLabel = '0926.3'
def appVersionName = '2.1.2'

android {
    namespace 'io.github.ariinyume.dlsitesoundfloat'
    compileSdk 34
    // ⚠️ 必须显式钉 34.0.0：AGP 8.1.0 的默认 build-tools 是 **33.0.1**，而本机 toolchain
    //    里的 33.0.1 缺 `core-lambda-stubs.jar` 等文件（工作区精简时被删）→ AGP 直接报
    //    「Installed Build Tools revision 33.0.1 is corrupted」。34.0.0 是完整的一套，
    //    也正是 docs/build.md 里写明的构建要求。
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "io.github.ariinyume.dlsitesoundfloat"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        debug {
            // 沿用默认 debug 签名
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // 需要 BuildConfig.APPLICATION_ID / VERSION_NAME 打进日志
        buildConfig true
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

// 让 APK 产物文件名带上「版本 + 构建类型」，便于区分各次打包。
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("DLsiteFloat-${appVersionTag}-${variant.buildType}.apk")
        }
    }
}

dependencies {
    // libxposed 现代 API（API 102）。compileOnly：API 由框架在运行时提供，不打进 APK。
    // ⚠️ 只能 compileOnly —— 打进包会导致模块与框架的 XposedInterface 类冲突。
    compileOnly 'io.github.libxposed:api:102.0.0'
}
