//        · 【代价已确认】切页时面板仍会随背景明暗变化 —— 这是 996 的固有行为，
//          也正是 997 想修的那一条。本轮按 Ari 的取舍回到该观感。
//    【2.3.0 / code 997 / label 1008.18】**亮度锁定 + 第 5 批重构**（1 项功能变更 + 1 项纯重构）
//        · 【变化一 · 亮度锁定】液态玻璃面板不再随背景亮度自适应。真机日志实测：
//          背景候选亮度在 14 秒内被**采纳地连跳三次**（0.21→0.38→0.19→0.37）。
//          两个叠加因由：① 霜色按目标反解时在「纯白 ↔ 中灰」之间剧摆（质感剧变）；
//          ② 背景透出率高达 72%，背景一抖面板就跟着抖。
//          ⇒ 霜色**锁定为常量**（不再解方程、不再读背景亮度）+ 面板加密
//          （背景透出 72% → 28%）。实测面板亮度变化 **0.127 → 0.050**，且无质感剧变。
//          ⚠️ 物理二选一：单层半透明面板无法同时做到亮度恒定与完全通透 ——
//          本版按 Ari 的选择取**亮度恒定**，牺牲部分通透感。
//        · 【变化二 · 第 5 批重构】结构探针的三道闸抽成 PokeThrottle（零状态纯内核）。
//          状态与重置点**全部留在原类** —— 取证实测它们落在跨 7 个组的枢纽方法里，
//          搬走必然状态分裂。节流逻辑首次可单测：新增 12 条黄金向量，
//          含两个【极易改错】的顺序锚（事件时间戳在合并闸之前更新 / 被合并时不碰桶）。
//        · 【验证】JUnit **34/34**（原 22 + 新 12）；dex 字节码层对照 996 包。
//    【2.3.0 / code 996 / label 1008.17】**架构第 4 批：作用域探测整体搬出**（先取证后动手，纯重构，无行为变更）
//        · 【先取证】对 4 个候选组做**精确方法边界**（花括号配平，非缩进正则）
//          定位读写点，结论：**只有作用域探测组跨组字段数为 0**，可整体搬。
//          ⇒ 粗解析的「跨 N 方法」不可当真：归属图写「跨 2 方法」，精确定位是「跨 5」。
//        · 【改法】11 个静态字段 + 3 个方法整体搬至 hook/ScopeWatcher，
//          注入主线程调度器与重画回调两个窄接口；调用点仅 2 处。
//        · 【否决其余三组】结构探针的重置点在跨 7 组的枢纽方法里，只能抽纯内核；
//          滑块快照散在 6 个方法且被几何内核调用侧读，搬走多一层间接；
//          播放按钮挑选的两个方法都要整棵视图树上下文，注入比收益重。
//        · 【版本号】2.2.14 升 **2.3.0**（架构重构轮次，按 Ari 指定走 minor 号）。
//        · 【诚实记账】本类与设置页侧的探测是**同一职责两处实现**，本轮刻意不合并
//          （跨进程边界不同），已在类头显式记下重复位置供将来收敛。
//    【2.2.14i / code 995 / label 1008.16】**架构第3 批 + 口径收敛**（纯工程，无行为变更）
//        （Ari 2026-10-09 指令「P1+P2 一起做」）
//        ① **修sPokeLogged 配额**：原logic 是 `if (sPokeLogged < 40) { sPokeLogged++; 打 }`
//        —— 打满 40 条后`structure event -> instant scan` 通道对**整个进程生命周期**
//        静默失效，且保留的恰是最没用的最早 40 条。取证：50 个 onResume 段里 46 段见过
//        播放页，只有 6 段有该通道证据 ⇒ **87% 的回合证据丢失**（单次回播放页就吃掉 37/40）。
//        改法：每条都打（上游 POKE_MIN_INTERVAL_MS=50ms + POKE_MAX_PER_SEC=12 令牌桶
//        双闸门封顶 12 行/秒）+ sPokeLogged 改**环形计数** + 每次进播放页重置。
//        ⚠️ **不碰 sPokeCount**（进程级累计，跨轮次对齐 #N 靠它）。
//        ② **第3 批重构**：抽出 `AnchorDeadPolicy`（锚点死亡三档确认窗的纯判定层，
//        零状态、4 处静态字段读由调用方入参传、阈值全走入参、判据顺序一字不改）。
//        取证结论：8 个候选区间的**独占字段全部为 0** ⇒ 整体搬移在任何候选上都不成立，
//        故沿用第 2 批成功路径（找纯算术子段）。
//        ③ **dp→px 口径收敛到 util/Utils**（⚠️ 实测推翻了初稿「9 处内联」的说法：
//        HsvColorPicker 那 4 处全是 float 中间量不是 dp→px；StatusBarSubtitleHook:3246
//        是 helper 函数体且多一层 ctx==null 兜底）。真实重复 = 5 个私有 dp() helper，
//        已收敛（SettingsActivity 57 / FloatingSubtitleView 20 / StatusBarSubtitleHook 21
//        / ColorSwatchRow / FloatingWindowManager 7）。**保留两套口径**（四舍五入 vs
//        TypedValue 截断）只搬不改；ActivityButtonHook.dip2px 严禁动（code 955 语义）。
//        ④ **抽config/Protocol.java**：8 个 action + 10 个 extra + 2 个包名收成唯一字符串
//        真源；两处旧类保留同名常量作转发壳 ⇒ 约 105 处调用点零改动；
//        全仓 action 硬编码归零。加 PROTOCOL_VERSION=1 与 selfCheck()。
//        ⑤ **补 app/src/test/**：把 CapsuleGeometry / PageFollowPolicy / AnchorDeadPolicy
//        三个纯函数内核的真机黄金向量固化成 JUnit（22 个测试），离线期就能拦住阈值回归。
//        ⑥ **诊断日志接LogGate**：7 个文件里只有 5 条 Log.i 是真诊断级（已迁）；
//        21 条 Log.w 告警按 LogGate 类头铁律 3 **保持常开不动**。
//
// 【code 1006】Ari 要求「这次修复不要升版本号，升 code 就行」⇒ versionName/tag 保持 2.3.1、
//   label 保持 1008.25，只把 versionCode 推到 1006（修「换作品时插件短暂无字幕」的第三例）。
def appVersionCode = 1006
def appVersionCodeLabel = '1008.25'
def appVersionName = '2.3.1'

android {
    namespace 'io.github.ariinyume.dlsitesoundfloat'
    compileSdk 34
    // ⚠️ 必须显式钉 34.0.0：AGP 8.1.0 的默认 build-tools 是 **33.0.1**，而本机 toolchain
    //    里的 33.0.1 缺 `core-lambda-stubs.jar` 等文件（工作区精简时被删）→ AGP 直接报
    //    「Installed Build Tools revision 33.0.1 is corrupted」。34.0.0 是完整的一套，
    //    也正是 docs/build.md 里写明的构建要求。
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "io.github.ariinyume.dlsitesoundfloat"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        debug {
            // 沿用默认 debug 签名
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // 需要 BuildConfig.APPLICATION_ID / VERSION_NAME 打进日志
        buildConfig true
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

// 让 APK 产物文件名带上「版本 + versionCode + 构建类型」。
// ⚠️【2026-10-04 Ari 指令】**文件名必须标出 versionCode** —— 历史上 2.1.3 出现过两个
//    不同的 code（955 / 958）、2.1.5 与「2.1.3 修复」也复用过同一个 958，光看
//    「DLsiteFloat-2.1.3-debug.apk」根本分不清装的是哪一版，返工时对不上号。
//    现在统一 DLsiteFloat-<versionName>-code<versionCode>-<buildType>.apk，
//    与工作区根目录的历史交付包命名（DLsiteFloat-2.1.4-code957-debug.apk）对齐。
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(
                    "DLsiteFloat-${appVersionTag}-code${appVersionCode}-${variant.buildType}.apk")
        }
    }
}

dependencies {
    // libxposed 现代 API（API 102）。compileOnly：API 由框架在运行时提供，不打进 APK。
    // ⚠️ 只能 compileOnly —— 打进包会导致模块与框架的 XposedInterface 类冲突。
    compileOnly 'io.github.libxposed:api:102.0.0'

    // ── 【M1】可视化设置页（PRD §7 / NFR-01）──────────────────────────────
    // 设置页是本模块**自己进程内**的独立 Activity（SettingsActivity），需要 MD3 组件。
    // ⚠️ 用 implementation（不是 compileOnly）：这些类要打进本模块 APK 供设置页使用。
    //    注入到宿主 / SystemUI 的视图（FloatingSubtitleView 等）一律用**代码构建**
    //    且不引用本模块资源 / 不依赖 Material（见 FloatingSubtitleView 类头），
    //    所以下游进程不会因为缺这些类而崩。
    // ⚠️ 首次构建需联网拉取（本机 toolchain/maven-local 里没有 androidx 制品）。
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.9.0'

    // ── 【code 995】纯函数内核的黄金向量回归测试 ───────────────────────────────
    // CapsuleGeometry / PageFollowPolicy / AnchorDeadPolicy 是从 ActivityButtonHook
    // （4700 行上帝类）抽出来的**纯判定层**，判据由 4~6 个阈值常量组合而成 ——
    // 改一个比较符就可能让「按钮提前消失」只在真机复现（v36 就是这种形状）。
    // 把真机实测值固化成 JUnit，让这类改动在**离线期**就被拦住。
    //
    // ⚠️ junit 是 testImplementation，**不进 APK**，不影响包体。
    // ⚠️ 制品已预置到 toolchain/maven-local（junit 4.13.2 + hamcrest-core 1.3），
    //    所以 --offline 构建照样能跑，不会临时去探网。
    testImplementation 'junit:junit:4.13.2'
}
